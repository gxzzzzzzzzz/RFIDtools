# 编译 M35mar/RFIDtools（Android App），但把内置的 proxmark3 客户端
# 从 master@61ede21f（CAPABILITIES_VERSION 13）降到 v4.23346（= 11）
#
# 为什么要这样做：
#   App 的客户端是「直接编译子模块源码」，CMake 里写死了
#   third_party/proxmark3/client/experimental_lib，所以客户端版本 = 子模块版本。
#   把子模块指到 v4.23346 的 commit，编出来的 APK 就是 v11 客户端，
#   与 v4.23346 固件严格配对。
#
# 用法（全程网页）：
#   1. fork https://github.com/M35mar/RFIDtools 到你自己的账号
#   2. 在你 fork 的仓库里新建文件 .github/workflows/android-v11.yml，粘贴本文件
#   3. 提交（这会触发一次构建）
#   4. Actions -> "Build RFIDtools APK (client = v4.23346 / v11)" -> Run workflow
#   5. 跑完下载 artifact：rfidtools-debug-apk
#
# 关键风险（必须先知道）：
#   App 用 patches/ 下 3 个补丁给客户端加 Android 需要的接口
#   （pm3_console 的流式抓取、pm3_input_* 交互输入、script run 队列）。
#   这些补丁是按 v13（10-27）的源码上下文写的，打到 v4.23346（9-18）上
#   可能有个别 hunk 冲突。下面用 `patch -F3` 做模糊匹配并逐个报告，
#   真冲突会在构建日志里点名是哪个文件、哪个 hunk。
#
# 产物说明：debug APK 用 debug key 签名，和官方 release APK 签名不同，
#   安装前必须先卸载已装的 2.4.0，且之后不能通过 App 内更新升级。

name: Build RFIDtools APK (client = v4.23346 / v11)

on:
  workflow_dispatch:
    inputs:
      pm3_ref:
        description: "proxmark3 commit（默认 v4.23346 = dc0110c2，capabilities 11）"
        required: true
        default: "dc0110c29d320e04b37ea436ee2924901407ae72"
        type: string
      patch_fuzz:
        description: "补丁模糊级别 0-3（冲突多时调大，默认 3）"
        required: false
        default: "3"
        type: string
      run_tests:
        description: "是否跑单元测试与 lint（慢，默认关）"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout (with proxmark3 submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # 只动子模块指针，不改仓库里的 .gitmodules / gitlink，
      # 所以不需要本地 git 才能完成，网页 fork 即可。
      - name: Repin proxmark3 submodule to the requested commit
        run: |
          set -euo pipefail
          cd third_party/proxmark3
          git fetch --depth 1 origin "${{ inputs.pm3_ref }}"
          git checkout --force FETCH_HEAD
          echo "--- pinned commit ---"
          git log -1 --format='%H  %ci  %s'
          echo "--- capabilities ---"
          grep -E '^#define CAPABILITIES_VERSION' include/pm3_cmd.h
          echo "--- experimental_lib present? ---"
          test -f client/experimental_lib/CMakeLists.txt && echo yes || { echo "::error::experimental_lib missing in this ref"; exit 1; }

      # 预先用模糊匹配打补丁：成功后 prepare-pm3.sh 会看到标记并跳过，
      # 失败则把具体文件/hunk 打到日志里，便于定位。
      - name: Pre-apply App patches with fuzz
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE"
          FUZZ="${{ inputs.patch_fuzz }}"
          for p in "$ROOT"/patches/*.patch; do
            echo "=============================================================="
            echo "== $(basename "$p")"
            cd "$ROOT/third_party/proxmark3"
            # -t 批处理模式：绝不交互等待输入（CI 里必须）
            if patch -t -p1 --forward --no-backup-if-mismatch -F"$FUZZ" < "$p"; then
              echo "OK (fuzz=$FUZZ)"
            else
              echo "::warning file=$(basename "$p")::patch did not apply cleanly, see hunks above"
            fi
          done

          echo "--------------------------------------------------------------"
          echo "patch markers (各应为 >=1)："
          for probe in \
            "$ROOT/third_party/proxmark3/client/src/ui.c:grabber_take_copy" \
            "$ROOT/third_party/proxmark3/client/src/pm3.c:pm3_cmdscript_run_pending" \
            "$ROOT/third_party/proxmark3/client/src/cmdparser.c:PRINTANDLOG_GRAB) | PRINTANDLOG_PRINT" ; do
            f="${probe%%:*}"; pat="${probe#*:}"
            printf '%-60s %s\n' "$(basename "$f"):$pat" "$(grep -cF "$pat" "$f" 2>/dev/null || echo 0)"
          done
          exit 0

      # JNI 用到的客户端符号，在这个 ref 里是否齐全。
      # 只报告不失败——真正的判定交给编译；这一步只是为了缩短一次 40 分钟的试错。
      - name: Preflight — check client APIs used by pm3_jni.c
        run: |
          P=third_party/proxmark3/client/src
          probe() { printf '%-34s %s\n' "$1" "${2:-<none>}"; }
          probe "client/src/pm3.h"      "$([ -f "$P/pm3.h" ] && echo present || echo MISSING)"
          probe "pm3_console"           "$(grep -rl 'pm3_console' "$P" --include='*.h' --include='*.c' 2>/dev/null | xargs -r -n1 basename | tr '\n' ' ')"
          probe "pm3_init"              "$(grep -rl 'pm3_init' "$P" --include='*.h' 2>/dev/null | xargs -r -n1 basename | tr '\n' ' ')"
          probe "supports_colors"       "$(grep -rl 'supports_colors' "$P" --include='*.h' 2>/dev/null | xargs -r -n1 basename | tr '\n' ' ')"
          probe "grabber_take_all"      "$(grep -rl 'grabber_take_all' "$P" --include='*.h' 2>/dev/null | xargs -r -n1 basename | tr '\n' ' ')"
          probe "pm3_input_read_line"   "$(grep -rl 'pm3_input_read_line' "$P" --include='*.h' 2>/dev/null | xargs -r -n1 basename | tr '\n' ' ')"

          miss=0
          for s in pm3_console pm3_init grabber_take_all pm3_input_read_line; do
            grep -rq "$s" "$P" --include='*.h' 2>/dev/null || { echo "::warning::missing symbol $s — client at this ref may be too old for the App's JNI glue"; miss=1; }
          done
          grep -rq 'supports_colors' "$P" --include='*.h' 2>/dev/null || echo "::warning::g_session.supports_colors not found — pm3_jni.c 里那两行需要删掉"
          exit 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          yes | sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: |
          if [ "${{ inputs.run_tests }}" = "true" ]; then
            ./gradlew :core:pm3:testDebugUnitTest :core:pm3:lintDebug :core:pm3:assembleDebug --stacktrace
          else
            ./gradlew :core:pm3:assembleDebug --stacktrace
          fi

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p out
          find core/pm3/build/outputs/apk -name "*.apk" -exec cp -v {} out/ \;
          ls -l out
          # 顺手把客户端里的 capabilities 版本记下来，便于对账
          {
            echo "proxmark3 commit : $(git -C third_party/proxmark3 rev-parse HEAD)"
            echo "proxmark3 date   : $(git -C third_party/proxmark3 log -1 --format=%ci)"
            echo "capabilities     : $(grep -E '^#define CAPABILITIES_VERSION' third_party/proxmark3/include/pm3_cmd.h | awk '{print $3}')"
            echo "apk sha256       :"
            sha256sum out/*.apk
          } | tee out/BUILD_INFO.txt

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: rfidtools-debug-apk
          path: out
          retention-days: 30
          if-no-files-found: error
